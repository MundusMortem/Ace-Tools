<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0e">
<title>Special Orders | Ace Tools</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../scanner/style.css?v=4">
<link rel="stylesheet" href="./orders.css">
<script type="module" src="./orders.mjs?v=5"></script>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<header><a class="brand" href="../"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 5 35 33H5L20 5Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M13 26h14M20 18v8" stroke="currentColor" stroke-width="3"/></svg><span>Ace Tools</span></a></header>
<main><section class="tool-page orders-page"><div class="emblem"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3"/><rect x="9" y="2" width="6" height="6" rx="2"/><path d="m8 15 3 3 5-6"/></svg></div><h1>Special Orders</h1><p id="order-intro">Only Ace SKUs can be processed.</p>
<form id="order-form" class="order-panel" aria-describedby="order-intro">
  <fieldset id="order-fields">
    <label for="order-type">Order type</label>
    <select id="order-type" name="orderType" required>
      <option value="">Select order type</option>
      <option value="STOCK">In-planogram stock only</option>
      <option value="CUSTOMER">Customer</option>
    </select>
    <label for="employee-name">Your name</label>
    <input id="employee-name" name="yourName" maxlength="100" required>
    <label for="order-sku">Ace SKU / model number</label>
    <div class="order-sku-row">
      <input id="order-sku" name="skuModel" maxlength="100" autocomplete="off" required>
      <button id="order-scan" class="order-button" type="button">Scan barcode</button>
    </div>
    <p id="order-scan-status" class="order-status" role="status"></p>
    <fieldset id="customer-fields" hidden disabled>
      <label for="order-quantity">Quantity</label>
      <input id="order-quantity" name="quantity" type="number" min="1" max="999999" step="1" required>
      <label for="order-description">Description or notes</label>
      <textarea id="order-description" name="description" rows="3" maxlength="2000" required></textarea>
      <label for="customer-info">Customer name and contact info</label>
      <textarea id="customer-info" name="customerInfo" rows="3" maxlength="500" required></textarea>
    </fieldset>
  </fieldset>
  <div class="order-actions">
    <button id="send-order" class="order-button order-primary" type="submit" disabled>Send order</button>
    <button id="new-order" class="order-button order-primary" type="button" hidden>Start another order</button>
    <button id="open-order-admin" class="order-button" type="button">Admin</button>
  </div>
  <p id="order-status" class="order-status" role="status"></p>
</form>
<dialog id="order-admin" class="order-panel" aria-labelledby="order-admin-title">
  <h2 id="order-admin-title">Order recipients</h2>
  <form id="order-admin-form">
    <fieldset id="order-admin-fields">
      <div id="order-login">
        <label for="order-admin-user">Username</label>
        <input id="order-admin-user" name="username" autocomplete="username" required>
        <label for="order-admin-password">Password</label>
        <input id="order-admin-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <fieldset id="order-recipient-fields" hidden disabled>
        <label for="order-recipients">Recipient email addresses</label>
        <textarea id="order-recipients" name="recipients" aria-describedby="order-recipient-hint" maxlength="5100" rows="4" required></textarea>
        <p id="order-recipient-hint" class="order-status">Enter one email address per line. Changes apply to everyone using this form.</p>
      </fieldset>
    </fieldset>
    <div class="order-actions">
      <button id="save-order-admin" class="order-button order-primary" type="submit">Sign in</button>
      <button id="close-order-admin" class="order-button" type="button">Close</button>
    </div>
    <p id="order-admin-status" class="order-status" role="status"></p>
  </form>
</dialog>
<a class="back" href="../"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg><span>Ace Tools</span></a></section></main>
</body>
</html>
